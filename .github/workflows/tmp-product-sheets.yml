name: tmp-product-sheets
on:
  workflow_dispatch:
  push:
    branches: [claude/tmp-product-sheets]
    paths-ignore: ['tmp-sheets/*.jpg']
permissions:
  contents: write
jobs:
  sheets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests
      - run: python tmp-sheets/build.py
      - run: |
          git config user.name "sheets-bot"
          git config user.email "sheets-bot@users.noreply.github.com"
          git add tmp-sheets/*.jpg
          git commit -m "chore(tmp): planches photo produits à compléter" || echo "nothing to commit"
          git push
